{% load static %}
<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Senha Redefinida - ECC Nacional</title>
  <link rel="icon" type="image/x-icon" href="{% static 'assets/img/favicon/favicon.ico' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'assets/vendor/css/core.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/demo.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/auth-pages.css' %}" />
</head>
<body class="auth-page">
  <div class="container">
    <div class="card auth-card reset-card mx-auto">
      <div class="auth-header reset-header">
        <div class="success-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
          </svg>
        </div>
        <h1>Senha Redefinida!</h1>
        <p>Seu acesso foi atualizado com sucesso</p>
      </div>
      <div class="card-body auth-body text-center">
        <p class="auth-copy mb-4" style="font-size: 0.95rem;">
          Sua senha foi redefinida com sucesso.<br>
          Agora você pode acessar o sistema com sua nova senha.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary btn-login w-100 py-2">
          Ir para o Login
        </a>
      </div>
    </div>
  </div>
  <script src="{% static 'assets/js/auth-pages.js' %}"></script>
</body>
</html>
