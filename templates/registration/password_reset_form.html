{% load static %}
<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Senha - ECC Nacional</title>
  <link rel="icon" type="image/x-icon" href="{% static 'assets/img/favicon/favicon.ico' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'assets/vendor/css/core.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/demo.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/auth-pages.css' %}" />
</head>
<body class="auth-page">
  <div class="container">
    <div class="card auth-card reset-card mx-auto">
      <div class="auth-header reset-header">
        <div class="auth-icon reset-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white" viewBox="0 0 16 16">
            <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
          </svg>
        </div>
        <h1>Recuperar Senha</h1>
        <p>Receba um link seguro para redefinir seu acesso</p>
      </div>
      <div class="card-body auth-body">
        <p class="auth-intro reset-intro">
          Informe o e-mail cadastrado e enviaremos um link para redefinir sua senha.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_email" class="form-label">E-mail</label>
            <div class="field-shell">
              <span class="field-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z"/>
                </svg>
              </span>
              <input type="email" name="email" id="id_email" class="form-control auth-input" placeholder="voce@exemplo.com" required autofocus>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-reset w-100 py-2 mb-3">
            Enviar link de recuperação
          </button>
        </form>

        <div class="text-center">
          <a href="{% url 'login' %}" class="back-link">← Voltar para o login</a>
        </div>
      </div>
    </div>
  </div>
  <script src="{% static 'assets/js/auth-pages.js' %}"></script>
</body>
</html>
