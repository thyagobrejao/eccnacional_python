{% load static %}
<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-mail Enviado - ECC Nacional</title>
  <link rel="icon" type="image/x-icon" href="{% static 'assets/img/favicon/favicon.ico' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'assets/vendor/css/core.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/demo.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/auth-pages.css' %}" />
</head>
<body class="auth-page">
  <div class="container">
    <div class="card auth-card reset-card mx-auto">
      <div class="auth-header reset-header">
        <div class="auth-icon reset-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
            <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z"/>
          </svg>
        </div>
        <h1>E-mail Enviado</h1>
        <p>Confira sua caixa de entrada para continuar</p>
      </div>
      <div class="card-body auth-body">
        <div class="text-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="success-check mb-3" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
          </svg>
          <p class="status-text mb-2">
            Se o e-mail informado estiver cadastrado, você receberá um link para redefinir sua senha em alguns minutos.
          </p>
          <p class="status-text" style="font-size: 0.86rem;">
            Verifique também sua caixa de spam.
          </p>
        </div>
        <div class="text-center">
          <a href="{% url 'login' %}" class="back-link">← Voltar para o login</a>
        </div>
      </div>
    </div>
  </div>
  <script src="{% static 'assets/js/auth-pages.js' %}"></script>
</body>
</html>
