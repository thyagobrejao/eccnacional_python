<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ECC Nacional{% endblock %}</title>
</head>
<body style="margin:0;padding:24px;background:#f3efe7;font-family:Arial,sans-serif;color:#1f352e;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:680px;margin:0 auto;background:#fffdf9;border-radius:24px;overflow:hidden;border:1px solid #dfe7e1;">
    <tr>
      <td style="padding:32px 32px 22px;background:linear-gradient(145deg,#e7f0ec,#f7f2e8);">
        <div style="width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#295c4f,#3b7a68);color:#ffffff;font-weight:700;font-size:20px;line-height:58px;text-align:center;letter-spacing:0.08em;">ECC</div>
        <h1 style="margin:18px 0 8px;font-size:30px;line-height:1.05;color:#1f352e;">{% block heading %}ECC Nacional{% endblock %}</h1>
        <p style="margin:0;font-size:15px;line-height:1.6;color:#61746d;">{% block subtitle %}{% endblock %}</p>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 32px 32px;">
        {% block content %}{% endblock %}
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 28px;font-size:13px;line-height:1.6;color:#71837b;">
        ECC Nacional<br>
        <a href="{{ portal_home_url }}" style="color:#295c4f;text-decoration:none;">{{ portal_home_url }}</a>
      </td>
    </tr>
  </table>
</body>
</html>
