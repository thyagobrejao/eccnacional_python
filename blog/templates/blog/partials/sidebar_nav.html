<div class="sidebar-card card mb-3">
    <div class="sidebar-header">
        <i class="fas fa-bars me-2"></i>Navegação
    </div>
    {% with current=request.resolver_match.url_name %}
    <a href="{% url 'blog:estrutura' %}" class="sidebar-nav-link{% if current == 'estrutura' %} active{% endif %}">
        <span class="sidebar-icon"><i class="fas fa-sitemap"></i></span>
        Estrutura de Direção
    </a>
    <a href="{% url 'blog:secretaria' %}" class="sidebar-nav-link{% if current == 'secretaria' %} active{% endif %}">
        <span class="sidebar-icon"><i class="fas fa-users"></i></span>
        Secretaria Nacional
    </a>
    <a href="{% url 'blog:regionais' %}" class="sidebar-nav-link{% if current == 'regionais' %} active{% endif %}">
        <span class="sidebar-icon"><i class="fas fa-map-marked-alt"></i></span>
        Regionais do ECC
    </a>
    <a href="{% url 'blog:estatisticas' %}" class="sidebar-nav-link{% if current == 'estatisticas' %} active{% endif %}">
        <span class="sidebar-icon"><i class="fas fa-chart-bar"></i></span>
        Estatísticas
    </a>
    <a href="{% url 'blog:fale_conosco' %}" class="sidebar-nav-link{% if current == 'fale_conosco' %} active{% endif %}">
        <span class="sidebar-icon"><i class="fas fa-envelope"></i></span>
        Fale Conosco
    </a>
    <a href="https://congresso2027.eccnacional.com.br" target="_blank" rel="noopener noreferrer" class="sidebar-nav-link">
        <span class="sidebar-icon"><i class="fas fa-calendar-alt"></i></span>
        Congresso 2027
    </a>
    {% endwith %}
</div>
<a href="https://gestao.conselhonacional.com.br"
   target="_blank"
   rel="noopener noreferrer"
   class="btn-gestao">
    <i class="fas fa-book-open fa-lg"></i>
    <span>Pedido de Material</span>
</a>
